[package]
name = "taskrunner"
version = "0.1.0"
edition = "2024"
description = "Local-first MCP delegation broker: hand tasks to coding-agent workers in isolated Docker containers, with a durable audit trail."

[lib]
path = "src/lib.rs"

[[bin]]
name = "taskrunner"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: audit payloads are re-serialized into the index, so key
# order must survive the round trip or every payload row differs from the log.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = "0.8"
rmcp = { version = "3", features = [
  "server", "client", "transport-io", "transport-async-rw",
  "transport-streamable-http-server", "transport-streamable-http-client-unix-socket",
  "schemars",
] }
schemars = "1"
clap = { version = "4", features = ["derive"] }
ulid = "1"
sha2 = "0.10"
chrono = "0.4"
anyhow = "1"
wait-timeout = "0.2"
indexmap = { version = "2", features = ["serde"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
nix = { version = "0.30", features = ["signal", "process"] }
async-trait = "0.1"
jsonschema = { version = "0.35", default-features = false }

[dev-dependencies]
async-trait = "0.1"
insta = "1"
nix = { version = "0.30", features = ["signal", "process"] }
rmcp = { version = "3", features = ["transport-child-process"] }
tempfile = "3"
tokio-util = "0.7"
